name: Compilar MiStreamer Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Preparar código fuente
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter MiStreamer.csproj -Recurse -File |
                     Select-Object -First 1

          if (-not $project) {
            $sourceZip = Get-ChildItem -Path . -Filter MiStreamerSource.zip -Recurse -File |
                         Select-Object -First 1

            if ($sourceZip) {
              Write-Host "Se encontró MiStreamerSource.zip. Descomprimiendo..."
              $extract = Join-Path $env:RUNNER_TEMP "MiStreamerSource"
              New-Item -ItemType Directory -Force -Path $extract | Out-Null
              Expand-Archive -Path $sourceZip.FullName -DestinationPath $extract -Force

              $project = Get-ChildItem -Path $extract -Filter MiStreamer.csproj -Recurse -File |
                         Select-Object -First 1
            }
          }

          if (-not $project) {
            Write-Error "No se encontró MiStreamer.csproj ni MiStreamerSource.zip."
            exit 1
          }

          Write-Host "Proyecto encontrado: $($project.FullName)"
          "PROJECT_PATH=$($project.FullName)" >> $env:GITHUB_ENV
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Restaurar paquetes
        shell: pwsh
        run: dotnet restore "$env:PROJECT_PATH"

      - name: Compilar MiStreamer
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_PATH" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "$env:GITHUB_WORKSPACE\publish"

      - name: Descargar FFmpeg para Windows
        shell: pwsh
        run: |
          $ffmpegInRepo = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" `
            -Filter ffmpeg.exe -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "$env:GITHUB_WORKSPACE\publish\*" } |
            Select-Object -First 1

          if ($ffmpegInRepo) {
            Write-Host "Usando ffmpeg.exe incluido en el repositorio."
            Copy-Item $ffmpegInRepo.FullName "$env:GITHUB_WORKSPACE\publish\ffmpeg.exe" -Force
            exit 0
          }

          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"

          Write-Host "Descargando FFmpeg..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $ffmpeg = Get-ChildItem -Path $dir -Filter ffmpeg.exe -Recurse -File |
                    Select-Object -First 1

          if (-not $ffmpeg) {
            Write-Error "FFmpeg fue descargado pero no se encontró ffmpeg.exe."
            exit 1
          }

          Copy-Item $ffmpeg.FullName "$env:GITHUB_WORKSPACE\publish\ffmpeg.exe" -Force
          Write-Host "FFmpeg copiado correctamente."

      - name: Verificar paquete
        shell: pwsh
        run: |
          Write-Host "Contenido final:"
          Get-ChildItem "$env:GITHUB_WORKSPACE\publish" |
            Format-Table Name, Length

          $app = Join-Path "$env:GITHUB_WORKSPACE\publish" "MiStreamer.exe"
          $ffmpeg = Join-Path "$env:GITHUB_WORKSPACE\publish" "ffmpeg.exe"

          if (-not (Test-Path $app)) {
            Write-Error "No se generó MiStreamer.exe"
            exit 1
          }

          if (-not (Test-Path $ffmpeg)) {
            Write-Error "No se encontró ffmpeg.exe en el paquete final"
            exit 1
          }

      - name: Crear ZIP portable
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\MiStreamer-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\publish\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

      - name: Subir programa compilado
        uses: actions/upload-artifact@v4
        with:
          name: MiStreamer-Windows-x64
          path: MiStreamer-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
